services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace

  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/workspace
      - ./dbt:/dbt
    command: ["dbt", "debug", "--profiles-dir", "/dbt/profiles"]

