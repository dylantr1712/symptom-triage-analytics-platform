name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall triage_app app tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f app/Dockerfile .
      - run: docker build -f dbt/Dockerfile .

  dbt-parse:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: dummy-account
      SNOWFLAKE_USER: dummy-user
      SNOWFLAKE_PASSWORD: dummy-password
      SNOWFLAKE_WAREHOUSE: TRIAGE_WH
      SNOWFLAKE_DATABASE: TRIAGE_PLATFORM
      SNOWFLAKE_SCHEMA: ANALYTICS
      SNOWFLAKE_RAW_SCHEMA: RAW
      SNOWFLAKE_ROLE: TRIAGE_APP_ROLE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r dbt/requirements.txt
      - run: dbt parse --project-dir dbt --profiles-dir dbt/profiles

